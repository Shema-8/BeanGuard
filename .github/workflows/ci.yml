name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r requirements-dev.txt
      - run: flake8 src api ui locust scripts tests
      - run: pytest -q
      - run: docker build -f Dockerfile.api -t heritage-api .
      - run: docker build -f Dockerfile.ui -t heritage-ui .
